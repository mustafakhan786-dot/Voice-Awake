
name: Build Voice Awareness EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name VoiceAwareness --add-data "852Hz_alarm.mp3;assets" --collect-all pygame --collect-all sounddevice --collect-all webrtcvad --collect-all numpy voice_awareness.py

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: VoiceAwareness-Windows
          path: dist/VoiceAwareness.exe
